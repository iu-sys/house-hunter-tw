<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>房子獵人</title>
    <style>
      .fallback-app {
        background: #f6f8fa;
        color: #1b2630;
        font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
        min-height: 100vh;
        padding: 22px;
      }

      .fallback-app header,
      .fallback-stats,
      .fallback-table {
        margin: 0 auto 14px;
        max-width: 1180px;
      }

      .fallback-app header {
        align-items: center;
        display: flex;
        justify-content: space-between;
      }

      .fallback-app h1 {
        font-size: 24px;
        margin: 0;
      }

      .fallback-app p {
        color: #657381;
        margin: 4px 0 0;
      }

      .fallback-stats {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .fallback-stat,
      .fallback-table {
        background: #fff;
        border: 1px solid #dde5ea;
        border-radius: 8px;
      }

      .fallback-stat {
        padding: 14px 16px;
      }

      .fallback-stat span {
        color: #657381;
        display: block;
        font-size: 13px;
      }

      .fallback-stat strong {
        display: block;
        font-size: 24px;
        margin-top: 4px;
      }

      .fallback-table {
        overflow: auto;
      }

      .fallback-table table {
        border-collapse: collapse;
        min-width: 860px;
        width: 100%;
      }

      .fallback-table th,
      .fallback-table td {
        border-top: 1px solid #e4ecef;
        font-size: 14px;
        padding: 11px 12px;
        text-align: left;
      }

      .fallback-table th {
        background: #f3f7f8;
        color: #596877;
        font-size: 12px;
      }

      .fallback-price {
        color: #0f766e;
        font-weight: 800;
        white-space: nowrap;
      }

      .fallback-new {
        background: #f59e0b;
        border-radius: 6px;
        color: #fff;
        display: inline-block;
        font-size: 12px;
        font-weight: 800;
        margin-right: 6px;
        padding: 2px 6px;
      }

      .fallback-table a {
        color: #0f766e;
        font-weight: 700;
        text-decoration: none;
      }

      @media (max-width: 760px) {
        .fallback-app {
          padding: 14px;
        }

        .fallback-app header,
        .fallback-stats {
          display: block;
        }

        .fallback-stat {
          margin-bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="fallback-app">
        <header>
          <div>
            <h1>房子獵人</h1>
            <p>雙北套房快篩表，更新時間載入中</p>
          </div>
          <p>React 互動版載入後可篩選、排序與搜尋</p>
        </header>
        <section class="fallback-stats" aria-label="搜尋統計">
          <div class="fallback-stat"><span>符合筆數</span><strong>載入中</strong></div>
          <div class="fallback-stat"><span>新上架</span><strong>載入中</strong></div>
          <div class="fallback-stat"><span>最低價</span><strong>載入中</strong></div>
          <div class="fallback-stat"><span>主要熱區</span><strong>載入中</strong></div>
        </section>
        <section class="fallback-table">
          <table>
            <thead>
              <tr>
                <th>區域</th>
                <th>價格</th>
                <th>標題</th>
                <th>坪數</th>
                <th>捷運站</th>
                <th>連結</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="6">正在載入最新租屋資料...</td></tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
